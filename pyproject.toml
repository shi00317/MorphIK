[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphik-reproduction"
version = "0.1.0"
description = "PyTorch reimplementation of morphology-conditioned neural inverse kinematics"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[tool.setuptools.packages.find]
include = ["morphik*"]
